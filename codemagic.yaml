workflows:
  tricko-ios-app-store:
    name: Tricko iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Tricko

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.trickostudio.videodesk

      vars:
        BUNDLE_ID: "com.trickostudio.videodesk"
        XCODE_PROJECT: "Tricko.xcodeproj"
        XCODE_SCHEME: "Tricko"
        APP_STORE_APPLE_ID: "6835779732"

      xcode: "27.1"

    scripts:
      - name: Verify native iOS project configuration
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          test -f "$XCODE_PROJECT/project.pbxproj"
          test -f "$XCODE_PROJECT/xcshareddata/xcschemes/$XCODE_SCHEME.xcscheme"
          test -f "$XCODE_PROJECT/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          grep -Fx "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID" Config/Tricko.xcconfig

      - name: Set up App Store signing
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles --project "$XCODE_PROJECT" \
            --custom-export-options '{"manageAppVersionAndBuildNumber": false}'

      - name: Build and verify signed IPA
        script: |
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          app_version="$(awk '$1 == "MARKETING_VERSION" && $2 == "=" {print $3}' Config/Tricko.xcconfig)"
          configured_build_number="$(awk '$1 == "CURRENT_PROJECT_VERSION" && $2 == "=" {print $3}' Config/Tricko.xcconfig)"
          latest_build_number="$(
            app-store-connect get-latest-build-number --log-stream stderr \
              --platform IOS --version-string "$app_version" "$APP_STORE_APPLE_ID"
          )"
          latest_build_number="${latest_build_number:-0}"
          codemagic_build_number="${PROJECT_BUILD_NUMBER:-1}"

          for number in "$latest_build_number" "$configured_build_number" "$codemagic_build_number"; do
            if [[ ! "$number" =~ ^[0-9]+$ ]]; then
              printf 'Expected an integer build number, got "%s".\n' "$number" >&2
              exit 1
            fi
          done

          next_build_number=$((10#$latest_build_number + 1))
          for number in "$configured_build_number" "$codemagic_build_number"; do
            if (( 10#$number > next_build_number )); then
              next_build_number=$((10#$number))
            fi
          done
          printf 'Building Tricko %s (%s)\n' "$app_version" "$next_build_number"

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-flags=-onlyUsePackageVersionsFromResolvedFile \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$next_build_number"

          packages=(build/ios/ipa/*.ipa)
          if (( ${#packages[@]} != 1 )) || [[ ! -f "${packages[0]}" ]]; then
            printf 'Expected exactly one exported IPA.\n' >&2
            exit 1
          fi
          ipa_info="$(mktemp)"
          trap 'rm -f "$ipa_info"' EXIT
          unzip -p "${packages[0]}" "Payload/$XCODE_SCHEME.app/Info.plist" > "$ipa_info"
          ipa_bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$ipa_info")"
          ipa_build_number="$(plutil -extract CFBundleVersion raw -o - "$ipa_info")"
          if [[ "$ipa_bundle_id" != "$BUNDLE_ID" || "$ipa_build_number" != "$next_build_number" ]]; then
            printf 'Expected IPA %s (%s), got %s (%s).\n' \
              "$BUNDLE_ID" "$next_build_number" "$ipa_bundle_id" "$ipa_build_number" >&2
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
